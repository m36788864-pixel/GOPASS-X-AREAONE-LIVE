<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>เช็คอิน | GOPASS ADMIN</title>
    <link
        rel="icon"
        href="/images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="/css/app.css?v=20261013"
    >
</head>
<body class="admin">
    <aside class="sidebar">
        <a
            class="brand"
            href="../index.html"
        >
            <img
                src="/images/gopass-logo.png"
                alt="GOPASS"
                width="30"
                height="30"
            >
            <span>
                GOPASS
                <small>ADMIN</small>
            </span>
        </a>
        <span class="side-heading kicker">CONSOLE</span>
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            แดชบอร์ด
        </a>
        <a href="sales.html">
            <i class="fa-solid fa-chart-column"></i>
            ยอดขาย
        </a>
        <a href="events.html">
            <i class="fa-solid fa-calendar-days"></i>
            คอนเสิร์ต
        </a>
        <a href="orders.html">
            <i class="fa-solid fa-ticket"></i>
            คำสั่งซื้อ
        </a>
        <a href="customers.html">
            <i class="fa-solid fa-users"></i>
            ลูกค้า
        </a>
        <a
            class="side-active"
            href="checkin.html"
        >
            <i class="fa-solid fa-qrcode"></i>
            เช็คอิน
        </a>
        <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            ตั้งค่า
        </a>
        <div class="side-bottom">
            <div class="admin-user">
                <i class="fa-solid fa-circle-user"></i>
                <span
                    class="admin-user-chip"
                    id="adminUsername"
                >-</span>
            </div>
            <a onclick="adminLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ออกจากระบบ
            </a>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-head">
            <div>
                <span class="kicker">CHECK-IN</span>
                <h1>เช็คอินหน้างาน</h1>
                <p>สแกนหมายเลขบัตรที่จุดเข้างาน แล้วระบบจะอัปเดตสถานะทันที</p>
            </div>
        </div>
        <div class="admin-card pad checkin-wrap">
            <label>
                <b>เลือกงาน</b>
                <select
                    id="eventSelect"
                    class="select event-select"
                >
                    <option value="">เลือกงาน</option>
                </select>
            </label>
            <div class="checkin-box">
                <form
                    id="checkinForm"
                    novalidate
                >
                    <label>
                        <b>หมายเลขบัตร / หมายเลขออเดอร์</b>
                        <input
                            id="ticketNo"
                            class="checkin-input"
                            autocomplete="off"
                            autofocus
                            placeholder="เช่น #0001 หรือ order-..."
                        >
                    </label>
                    <button
                        class="btn red full"
                        type="submit"
                    >
                        <i class="fa-solid fa-check"></i>
                        ยืนยันเช็คอิน
                    </button>
                    <button
                        class="btn outline full"
                        id="reportBtn"
                        type="button"
                    >
                        <i class="fa-solid fa-file-pdf"></i>
                        รายงาน / พิมพ์เป็น PDF
                    </button>
                </form>
                <div
                    id="result"
                    class="checkin-result"
                >
                    <h2>พร้อมเช็คอิน</h2>
                    <p>กรอกหมายเลขบัตร/QR ของผู้เข้างานเพื่อยืนยัน</p>
                </div>
            </div>
            <div class="mini-stats">
                <div class="mini-stat">
                    <span>บัตรที่ขาย</span>
                    <b id="sold">-</b>
                </div>
                <div class="mini-stat">
                    <span>เช็คอินแล้ว</span>
                    <b id="checked">-</b>
                </div>
                <div class="mini-stat">
                    <span>คนรอ</span>
                    <b id="pending">-</b>
                </div>
            </div>
        </div>
    </main>
    <script src="/js/vendor/lenis.min.js"></script>
    <script src="/js/app.js?v=20261013"></script>
    <script src="/js/checkin.js"></script>
    <script src="/js/i18n.js?v=20261011"></script>
</body>
</html>
