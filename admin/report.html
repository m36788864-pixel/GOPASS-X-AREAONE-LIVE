<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>รายงาน | GOPASS ADMIN</title>
    <link
        rel="icon"
        href="/images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="/css/app.css?v=20261013"
    >
</head>
<body>
    <div class="wrap page report-wrap">
        <div class="report-toolbar no-print">
            <button
                class="btn red"
                type="button"
                onclick="window.print()"
            >
                <i class="fa-solid fa-print"></i>
                พิมพ์ / พิมพ์เป็น PDF
            </button>
            <button
                class="btn outline"
                type="button"
                onclick="location.href='checkin.html'"
            >
                <i class="fa-solid fa-arrow-left"></i>
                กลับไปเช็คอิน
            </button>
        </div>
        <section class="report-head">
            <div>
                <div class="brand">
                    <img
                        src="/images/gopass-logo.png"
                        alt="GOPASS"
                        width="30"
                        height="30"
                    >
                    <span>
                        GOPASS
                        <small>REPORT</small>
                    </span>
                </div>
                <h1 id="eventName">กำลังโหลด...</h1>
                <div
                    id="eventMeta"
                    class="report-meta"
                ></div>
            </div>
            <div
                id="generated"
                class="report-generated"
            ></div>
        </section>
        <div class="report-stats">
            <div>
                <span>คำสั่งซื้อ</span>
                <b id="orders">-</b>
            </div>
            <div>
                <span>บัตรที่ขาย</span>
                <b id="tickets">-</b>
            </div>
            <div>
                <span>เช็คอินแล้ว</span>
                <b id="checked">-</b>
            </div>
            <div>
                <span>คนรอเข้างาน</span>
                <b id="pending">-</b>
            </div>
        </div>
        <section class="report-block">
            <h2>ยอดขายแยกตามประเภทบัตร</h2>
            <div id="types">กำลังโหลด...</div>
        </section>
        <section class="report-block">
            <h2>รายชื่อผู้ซื้อทั้งหมด</h2>
            <div id="buyers">กำลังโหลด...</div>
        </section>
        <section class="report-block">
            <h2>รายการเช็คอิน</h2>
            <div id="checkins">กำลังโหลด...</div>
        </section>
    </div>
    <script src="/js/vendor/lenis.min.js"></script>
    <script src="/js/app.js?v=20261013"></script>
    <script>
        (async () => {
            const q = new URLSearchParams(location.search);
            const id = q.get('event');
            const token = localStorage.getItem('gopass_admin_token') || '';
            if (!token || !id) { location.href = 'login.html'; return; }
            const r = await fetch('/api/admin/event-report/' + encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + token } });
            const d = await r.json();
            if (!r.ok) {
                document.getElementById('buyers').innerHTML =
                    '<p class="report-error"><i class="fa-solid fa-triangle-exclamation"></i> ' + esc(d.message || 'โหลดรายงานไม่สำเร็จ') + '</p>';
                return;
            }
            document.title = 'รายงาน ' + d.event.name + ' | GOPASS';
            document.getElementById('eventName').textContent = d.event.name;
            document.getElementById('eventMeta').innerHTML =
                `<span><i class="fa-regular fa-calendar"></i>${esc(d.event.date)}</span> ` +
                `<span><i class="fa-regular fa-clock"></i>${esc(d.event.time)} น.</span> ` +
                `<span><i class="fa-solid fa-location-dot"></i>${esc(d.event.venue)}</span>`;
            document.getElementById('generated').textContent = 'สร้างเมื่อ ' + new Date(d.generatedAt).toLocaleString('th-TH');
            document.getElementById('orders').textContent = d.summary.orders.toLocaleString('th-TH');
            document.getElementById('tickets').textContent = d.summary.tickets.toLocaleString('th-TH');
            document.getElementById('checked').textContent = d.summary.checkedInTickets.toLocaleString('th-TH');
            document.getElementById('pending').textContent = d.summary.pendingTickets.toLocaleString('th-TH');
            document.getElementById('types').innerHTML = d.ticketTypes.length
                ? d.ticketTypes.map(x => `<div class="report-line"><span>${esc(x.name)} · ${x.tickets.toLocaleString('th-TH')} ใบ · เช็คอิน ${x.checkedIn.toLocaleString('th-TH')}</span><b>${Number(x.revenue || 0).toLocaleString('th-TH')} บาท</b></div>`).join('') +
                  `<div class="report-line is-total"><span>ยอดรวม</span><b>${Number(d.summary.revenue || 0).toLocaleString('th-TH')} บาท</b></div>`
                : '<p class="muted">ยังไม่มีคำสั่งซื้อ</p>';
            document.getElementById('buyers').innerHTML = (d.orders || []).length
                ? `<div class="report-table-wrap"><table class="report-table">
                    <thead><tr><th>วันเวลา</th><th>ชื่อผู้ซื้อ</th><th>โทรศัพท์</th><th>อีเมล</th><th>Discord</th><th>Roblox</th><th>บัตร / คิว</th><th>จำนวน</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead>
                    <tbody>${d.orders.map(x => {
                        const b = x.buyer || {};
                        return `<tr>
                            <td>${new Date(x.createdAt).toLocaleString('th-TH')}</td>
                            <td><b>${esc(b.name || '-')}</b></td>
                            <td>${esc(b.phone || '-')}</td>
                            <td>${esc(b.email || '-')}</td>
                            <td>${esc(b.discord || '-')}</td>
                            <td>${esc(b.roblox || '-')}</td>
                            <td>${esc(x.ticketName || x.ticketType || '-')}${x.seatLabels ? ' · ' + esc(x.seatLabels) : ''}<small>${esc(x.ticketNo || x.queueCode || '-')}</small></td>
                            <td>${x.qty || 0}</td>
                            <td class="money">${Number(x.total || 0).toLocaleString('th-TH')} บาท</td>
                            <td>${x.checkedInAt ? '<span class="report-status ok">เช็คอินแล้ว</span>' : '<span class="report-status">ยังไม่เช็คอิน</span>'}</td>
                        </tr>`;
                    }).join('')}</tbody></table></div>`
                : '<p class="muted">ยังไม่มีคำสั่งซื้อ</p>';
            document.getElementById('checkins').innerHTML = d.checkins.length
                ? `<div class="report-table-wrap"><table class="report-table">
                    <thead><tr><th>เวลา</th><th>คิว</th><th>อีเมล</th><th>ประเภทบัตร</th><th>จำนวน</th></tr></thead>
                    <tbody>${d.checkins.map(x => `<tr>
                        <td>${new Date(x.checkedInAt).toLocaleString('th-TH')}</td>
                        <td>${esc(x.queueCode || x.id)}</td>
                        <td>${esc(x.buyer?.email || '-')}</td>
                        <td>${esc(x.ticketName || x.ticketType || '-')}</td>
                        <td>${x.qty || 0}</td>
                    </tr>`).join('')}</tbody></table></div>`
                : '<p class="muted">ยังไม่มีรายการเช็คอิน</p>';
        })();
    </script>
    <script src="/js/i18n.js?v=20261011"></script>
</body>
</html>
