<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>ยอดขาย | GOPASS ADMIN</title>
    <link
        rel="icon"
        href="/images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="/css/app.css?v=20261013"
    >
</head>
<body class="admin">
    <aside class="sidebar">
        <a
            class="brand"
            href="../index.html"
        >
            <img
                src="/images/gopass-logo.png"
                alt="GOPASS"
                width="30"
                height="30"
            >
            <span>
                GOPASS
                <small>ADMIN</small>
            </span>
        </a>
        <span class="side-heading kicker">CONSOLE</span>
        <a href="dashboard.html">
            <i class="fa-solid fa-chart-line"></i>
            แดชบอร์ด
        </a>
        <a
            class="side-active"
            href="sales.html"
        >
            <i class="fa-solid fa-chart-column"></i>
            ยอดขาย
        </a>
        <a href="events.html">
            <i class="fa-solid fa-calendar-days"></i>
            คอนเสิร์ต
        </a>
        <a href="orders.html">
            <i class="fa-solid fa-ticket"></i>
            คำสั่งซื้อ
        </a>
        <a href="customers.html">
            <i class="fa-solid fa-users"></i>
            ลูกค้า
        </a>
        <a href="checkin.html">
            <i class="fa-solid fa-qrcode"></i>
            เช็คอิน
        </a>
        <a href="settings.html">
            <i class="fa-solid fa-gear"></i>
            ตั้งค่า
        </a>
        <div class="side-bottom">
            <div class="admin-user">
                <i class="fa-solid fa-circle-user"></i>
                <span
                    class="admin-user-chip"
                    id="adminUsername"
                >-</span>
            </div>
            <a onclick="adminLogout()">
                <i class="fa-solid fa-arrow-right-from-bracket"></i>
                ออกจากระบบ
            </a>
        </div>
    </aside>
    <main class="admin-main">
        <div class="admin-head">
            <div>
                <span class="kicker">SALES SUMMARY</span>
                <h1>สรุปยอดขายบัตรของงาน</h1>
                <p>ดูจำนวนบัตร ออเดอร์ รายได้ และสถานะการเช็คอินของแต่ละงานจากข้อมูลจริง</p>
            </div>
            <div class="admin-sales-tools">
                <label for="salesEventSelect">เลือกงาน</label>
                <select
                    id="salesEventSelect"
                    class="select"
                >
                    <option value="">กำลังโหลด...</option>
                </select>
            </div>
        </div>
        <section
            id="salesSummary"
            class="admin-card pad admin-sales-card"
        >
            <div class="admin-sales-loading">
                <i class="fa-solid fa-spinner fa-spin"></i>
                กำลังโหลดสรุปยอดขาย...
            </div>
        </section>
    </main>
    <script src="/js/vendor/lenis.min.js"></script>
    <script src="/js/app.js?v=20261013"></script>
    <script>
        (async () => {
            if (!adminGuard()) return;
            const select = document.getElementById('salesEventSelect');
            const wrap = document.getElementById('salesSummary');
            const token = adminToken();
            const moneyTH = n => Number(n || 0).toLocaleString('th-TH') + ' บาท';
            const escLocal = s => String(s ?? '').replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' }[m]));
            const dateTHLocal = v => { if (!v) return '-'; return new Date(v + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: 'numeric' }); };
            try {
                const r = await fetch('/api/events');
                const events = await r.json();
                if (!r.ok) throw new Error(events.message || 'โหลดงานไม่สำเร็จ');
                if (!events.length) {
                    select.innerHTML = '<option value="">ยังไม่มีงาน</option>';
                    wrap.innerHTML = '<div class="admin-sales-empty"><i class="fa-solid fa-chart-column"></i><b>ยังไม่มีงานในระบบ</b><span>เพิ่มงานจากเมนูคอนเสิร์ตก่อน</span></div>';
                    return;
                }
                const saved = sessionStorage.getItem('gopass_admin_sales_event');
                select.innerHTML = events.map(e => `<option value="${escLocal(e.id)}">${escLocal(e.name)} · ${escLocal(e.date || '')}</option>`).join('');
                select.value = events.some(e => e.id === saved) ? saved : events[0].id;
                async function draw(id) {
                    if (!id) return;
                    wrap.innerHTML = '<div class="admin-sales-loading"><i class="fa-solid fa-spinner fa-spin"></i>กำลังโหลดข้อมูลของงาน...</div>';
                    try {
                        const res = await fetch('/api/admin/event-report/' + encodeURIComponent(id), { headers: { Authorization: 'Bearer ' + token } });
                        const d = await res.json();
                        if (!res.ok) throw new Error(d.message || 'โหลดสรุปยอดไม่สำเร็จ');
                        const e = d.event || {}, s = d.summary || {};
                        sessionStorage.setItem('gopass_admin_sales_event', id);
                        const types = (d.ticketTypes || []).map(t => `<div class="admin-sales-type"><div><strong>${escLocal(t.name)}</strong><small>${Number(t.orders || 0).toLocaleString('th-TH')} ออเดอร์ · ${Number(t.tickets || 0).toLocaleString('th-TH')} ใบ · เช็คอิน ${Number(t.checkedIn || 0).toLocaleString('th-TH')} ใบ</small></div><b>${moneyTH(t.revenue)}</b></div>`).join('');
                        wrap.innerHTML = `
                          <div class="admin-sales-top">
                            <div class="admin-sales-event">
                              ${e.image ? `<img src="${escLocal(e.image)}" alt="${escLocal(e.name)}">` : '<div class="admin-sales-event-fallback"><i class="fa-solid fa-ticket"></i></div>'}
                              <div><span class="kicker">${escLocal(e.status || 'GOPASS')}</span><h2>${escLocal(e.name || '-')}</h2><p><i class="fa-regular fa-calendar"></i>${dateTHLocal(e.date)} · ${escLocal(e.time || '-')} น.</p><p><i class="fa-solid fa-location-dot"></i>${escLocal(e.venue || '-')}</p></div>
                            </div>
                            <div class="admin-sales-updated">อัปเดต ${new Date(d.generatedAt).toLocaleString('th-TH')}</div>
                          </div>
                          <div class="admin-sales-stat-grid">
                            <div class="admin-sales-stat"><span>บัตรขายแล้ว</span><strong>${Number(s.tickets || 0).toLocaleString('th-TH')}</strong><small>ใบ</small></div>
                            <div class="admin-sales-stat"><span>คำสั่งซื้อ</span><strong>${Number(s.orders || 0).toLocaleString('th-TH')}</strong><small>รายการ</small></div>
                            <div class="admin-sales-stat"><span>เช็คอินแล้ว</span><strong>${Number(s.checkedInTickets || 0).toLocaleString('th-TH')}</strong><small>ใบ</small></div>
                            <div class="admin-sales-stat highlight"><span>ยอดขายรวม</span><strong>${moneyTH(s.revenue)}</strong><small>จากรายการที่ยืนยันแล้ว</small></div>
                          </div>
                          <div class="admin-sales-bottom">
                            <div class="admin-sales-panel">
                              <div class="admin-sales-subhead">ยอดขายแยกตามประเภทบัตร</div>
                              <div class="admin-sales-type-list">${types || '<div class="admin-sales-empty">ยังไม่มีคำสั่งซื้อที่ยืนยัน</div>'}</div>
                            </div>
                            <div class="admin-sales-pending"><span>ยังไม่เช็คอิน</span><strong>${Number(s.pendingTickets || 0).toLocaleString('th-TH')}</strong><small>ใบ</small><button class="btn red" type="button" onclick="location.href='checkin.html'">ไปเช็คอิน</button></div>
                          </div>
                          <div class="admin-sales-orders">
                            <h3>รายชื่อผู้ซื้อและข้อมูลคำสั่งซื้อ</h3>
                            <div class="sales-table-wrap">
                              <table class="sales-table">
                                <thead><tr><th>วันเวลา</th><th>ชื่อผู้ซื้อ</th><th>โทรศัพท์</th><th>อีเมล</th><th>Discord</th><th>Roblox</th><th>บัตร / คิว</th><th>จำนวน</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead>
                                <tbody>${(d.orders || []).length ? (d.orders || []).map(o => {
                                    const b = o.buyer || {};
                                    const st = o.checkedInAt ? '<span class="sales-status checked">เช็คอินแล้ว</span>' : '<span class="sales-status">ยังไม่เช็คอิน</span>';
                                    return `<tr><td>${new Date(o.createdAt).toLocaleString('th-TH')}<small>${escLocal(o.id)}</small></td><td><div class="buyer-main">${escLocal(b.name || '-')}</div></td><td>${escLocal(b.phone || '-')}</td><td>${escLocal(b.email || '-')}</td><td>${escLocal(b.discord || '-')}</td><td>${escLocal(b.roblox || '-')}</td><td><b>${escLocal(o.ticketName || o.ticketType || '-')}</b><small>${escLocal(o.ticketNo || o.queueCode || '-')}</small></td><td>${Number(o.qty || 0).toLocaleString('th-TH')} ใบ</td><td class="money">${moneyTH(o.total)}</td><td>${st}</td></tr>`;
                                }).join('') : '<tr><td colspan="10" class="sales-empty">ยังไม่มีคำสั่งซื้อที่ยืนยัน</td></tr>'}</tbody>
                              </table>
                            </div>
                          </div>
                          <div class="admin-sales-actions">
                            <a class="btn outline" href="report.html?event=${encodeURIComponent(e.id)}"><i class="fa-solid fa-file-lines"></i>เปิดรายงานงาน</a>
                            <button class="btn red" type="button" onclick="window.print()"><i class="fa-solid fa-print"></i>พิมพ์ / PDF</button>
                          </div>`;
                    } catch (err) {
                        wrap.innerHTML = `<div class="admin-sales-empty error"><i class="fa-solid fa-triangle-exclamation"></i><b>โหลดสรุปยอดไม่สำเร็จ</b><span>${escLocal(err.message)}</span></div>`;
                    }
                }
                select.addEventListener('change', () => draw(select.value));
                await draw(select.value);
            } catch (err) {
                select.innerHTML = '<option value="">โหลดไม่สำเร็จ</option>';
                wrap.innerHTML = `<div class="admin-sales-empty error"><i class="fa-solid fa-triangle-exclamation"></i><b>โหลดข้อมูลไม่สำเร็จ</b><span>${escLocal(err.message)}</span></div>`;
            }
        })();
    </script>
    <script src="/js/i18n.js?v=20261011"></script>
</body>
</html>
