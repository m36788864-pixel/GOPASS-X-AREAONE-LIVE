<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>ปฏิทินงาน | GOPASS</title>
    <link
        rel="icon"
        href="images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="css/app.css?v=20261013"
    >
    <script src="/js/maintenance.js?v=20261014"></script>
</head>
<body>
    <a
        class="skip-link"
        href="#calGrid"
    >
        ข้ามไปยังปฏิทิน
    </a>
    <header class="site-header">
        <div class="wrap nav">
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="images/gopass-logo.png"
                    alt="GOPASS"
                    width="30"
                    height="30"
                >
                <span>
                    GOPASS
                    <small>TICKETING</small>
                </span>
            </a>
            <nav>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    หน้าแรก
                </a>
                <a href="/events.html">
                    <i class="fa-solid fa-ticket"></i>
                    คอนเสิร์ต
                </a>
                <a
                    class="active"
                    href="/calendar.html"
                >
                    <i class="fa-solid fa-calendar-days"></i>
                    ปฏิทิน
                </a>
            </nav>
            <a
                class="login-btn"
                href="/login.html"
            >
                <i class="fa-brands fa-discord"></i>
                เข้าสู่ระบบ
            </a>
        </div>
    </header>
    <main class="wrap page">
        <div class="page-head reveal">
            <div>
                <span class="kicker">EVENT CALENDAR</span>
                <h1>ปฏิทินงาน</h1>
                <p>กดวันที่ต้องการด้านล่างเพื่อดูงานของวันนั้น แล้วกดบัตรได้เลย</p>
            </div>
        </div>
        <section class="cal" aria-label="ปฏิทินรายเดือน">
            <div class="cal-bar">
                <div class="cal-nav">
                    <button
                        type="button"
                        id="calPrev"
                        class="cal-step"
                        aria-label="เดือนก่อนหน้า"
                    >
                        <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <h2
                        id="calLabel"
                        class="cal-month"
                        aria-live="polite"
                    ></h2>
                    <button
                        type="button"
                        id="calNext"
                        class="cal-step"
                        aria-label="เดือนถัดไป"
                    >
                        <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
                <button
                    type="button"
                    id="calToday"
                    class="btn ghost"
                >
                    <i class="fa-solid fa-calendar-day"></i>
                    วันนี้
                </button>
            </div>
            <div class="cal-legend">
                <span class="cal-lg cal-lg--open">เปิดขาย</span>
                <span class="cal-lg cal-lg--soon">เร็ว ๆ นี้</span>
            </div>
            <div class="cal-card">
                <div
                    id="calGrid"
                    class="cal-grid"
                    role="grid"
                >
                    <div class="cal-loading">
                        <i class="fa-solid fa-spinner fa-spin"></i>
                        กำลังโหลดปฏิทิน...
                    </div>
                </div>
                <div
                    id="calDayPanel"
                    class="cal-drawer"
                    aria-live="polite"
                ></div>
            </div>
            <p
                id="calLive"
                class="sr-only"
                aria-live="polite"
            ></p>
        </section>
    </main>
    <footer>
        <div class="wrap footer">
            <span>© 2026 GOPASS</span>
            <a href="/admin/events.html">
                <i class="fa-solid fa-lock"></i>
                Admin
            </a>
        </div>
    </footer>
    <script src="js/vendor/lenis.min.js"></script>
    <script src="js/app.js?v=20261013"></script>
    <script>
        renderCalendar();
    </script>
    <script src="js/i18n.js?v=20261011"></script>
    <!-- mobile floating tab bar -->
    <nav class="tabbar" aria-label="เมนูหลัก">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a>
        <a href="/events.html"><i class="fa-solid fa-ticket"></i><span>คอนเสิร์ต</span></a>
        <a class="active" href="/calendar.html"><i class="fa-solid fa-calendar-days"></i><span>ปฏิทิน</span></a>
        <a href="/mytickets.html"><i class="fa-solid fa-receipt"></i><span>บัตรของฉัน</span></a>
        <a href="/login.html"><i class="fa-solid fa-user"></i><span>เข้าสู่ระบบ</span></a>
    </nav>
</body>
</html>
