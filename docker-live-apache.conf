# ส่งทุก request ใต้ /live/ ไปที่ Node server ของ AREAONE-LIVE
# (รันในคอนเทนเนอร์เดียวกัน พอร์ต 3000) — ลำดับสำคัญ: /live/ (เจาะจงกว่า) ก่อน /live
ProxyPass /live/ http://127.0.0.1:3000/ retry=0 timeout=300
ProxyPass /live http://127.0.0.1:3000/ retry=0 timeout=300
ProxyPassReverse /live/ http://127.0.0.1:3000/