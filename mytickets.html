<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>บัตรของฉัน | GOPASS</title>
    <link
        rel="icon"
        href="images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="css/app.css?v=20261013"
    >
    <script src="/js/maintenance.js?v=20261014"></script>
</head>
<body>
    <header class="site-header">
        <div class="wrap nav">
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="images/gopass-logo.png"
                    alt="GOPASS"
                    width="30"
                    height="30"
                >
                <span>
                    GOPASS
                    <small>TICKETING</small>
                </span>
            </a>
            <nav>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    หน้าแรก
                </a>
                <a href="/events.html">
                    <i class="fa-solid fa-ticket"></i>
                    คอนเสิร์ต
                </a>
                <a href="/calendar.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    ปฏิทิน
                </a>
            </nav>
            <a
                class="login-btn"
                href="/login.html"
            >
                <i class="fa-brands fa-discord"></i>
                เข้าสู่ระบบ
            </a>
        </div>
    </header>
    <main class="wrap page">
        <div class="page-head">
            <span class="kicker">MY TICKETS</span>
            <h1>บัตรของฉัน</h1>
            <p id="mtGreeting">ประวัติการกดบัตรทั้งหมดของคุณจะแสดงที่นี่</p>
        </div>
        <div id="mtSummary" class="mt-summary"></div>
        <div id="ticketList" class="mytickets">
            <div class="loading-block">
                <i class="fa-solid fa-spinner fa-spin"></i>
                กำลังโหลด...
            </div>
        </div>
    </main>
    <footer>
        <div class="wrap footer">
            <span>© 2026 GOPASS</span>
            <a href="/admin/events.html">
                <i class="fa-solid fa-lock"></i>
                Admin
            </a>
        </div>
    </footer>
    <script src="js/vendor/lenis.min.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/app.js?v=20261013"></script>
    <script>
        (async () => {
            const user = await gopassRequireLogin("/mytickets.html");
            if (!user) return;

            const greeting = document.getElementById("mtGreeting");
            if (greeting) {
                const who = user.displayName || user.username || "";
                greeting.textContent = who
                    ? `สวัสดี ${who} · ประวัติการกดบัตรทั้งหมดของคุณจะแสดงที่นี่`
                    : "ประวัติการกดบัตรทั้งหมดของคุณจะแสดงที่นี่";
            }

            const listEl = document.getElementById("ticketList");
            const summaryEl = document.getElementById("mtSummary");

            function mtLiveCodes(o) {
                const codes = Array.isArray(o.liveCodes) ? o.liveCodes.filter(Boolean) : [];
                if (!codes.length) return "";
                const site = o.liveSiteUrl || "";
                const dmNote = o.liveDmSentAt ? "ระบบส่งโค้ดเข้า Discord DM ให้แล้ว" : "ระบบส่งโค้ดเข้า Discord DM ให้ด้วย";
                return `
                    <div class="mt-live">
                        <div class="mt-live-head"><i class="fa-solid fa-tower-broadcast"></i> โค้ดดูไลฟ์ของคุณ <span>1 โค้ด = 1 บัตร</span></div>
                        <div class="mt-live-list">${codes.map(c => `<code>${esc(c)}</code>`).join("")}</div>
                        ${site ? `<a class="btn outline sm mt-live-btn" href="${esc(site)}" target="_blank" rel="noopener"><i class="fa-solid fa-play"></i> ไปหน้าเว็บดูไลฟ์</a>` : ""}
                        <div class="mt-live-dm"><i class="fa-brands fa-discord"></i> ${dmNote}</div>
                    </div>`;
            }

            function statusChip(o) {
                if (o.checkedInAt) return `<span class="mt-status mt-status--in"><i class="fa-solid fa-circle-check"></i> เช็คอินแล้ว</span>`;
                if (o.status === "completed") return `<span class="mt-status mt-status--ok"><i class="fa-solid fa-circle-check"></i> ยืนยันแล้ว</span>`;
                return `<span class="mt-status mt-status--wait"><i class="fa-solid fa-hourglass-half"></i> รอกรอกข้อมูล</span>`;
            }

            function orderCard(o) {
                const thumb = o.eventImage
                    ? `<div class="mt-thumb"><img src="${esc(o.eventImage)}" alt=""></div>`
                    : `<div class="mt-thumb mt-thumb--fallback"><i class="fa-solid fa-music"></i></div>`;
                const dateLine = [dateTH(o.eventDate), o.eventTime ? o.eventTime + " น." : ""].filter(Boolean).join(" · ");
                const isCompleted = o.status === "completed";
                const action = isCompleted
                    ? `<a class="btn red sm" href="receipt.html?id=${encodeURIComponent(o.eventId)}&order=${encodeURIComponent(o.id)}"><i class="fa-solid fa-receipt"></i> ดูใบเสร็จ</a>`
                    : `<a class="btn red sm" href="buyer.html?id=${encodeURIComponent(o.eventId)}&order=${encodeURIComponent(o.id)}"><i class="fa-solid fa-pen"></i> กรอกข้อมูลต่อ</a>`;
                return `<article class="mt-card">
                    ${thumb}
                    <div class="mt-body">
                        <div class="mt-top">
                            <div>
                                <h3>${esc(o.eventName || "ไม่พบงาน")}</h3>
                                ${dateLine ? `<p class="mt-meta"><i class="fa-regular fa-calendar"></i> ${esc(dateLine)}</p>` : ""}
                                ${o.eventVenue ? `<p class="mt-meta"><i class="fa-solid fa-location-dot"></i> ${esc(o.eventVenue)}</p>` : ""}
                            </div>
                            ${statusChip(o)}
                        </div>
                        <div class="mt-rows">
                            <div class="mt-row"><span>เลขบัตร</span><b>${esc(o.ticketNo || o.queueCode || o.id)}</b></div>
                            <div class="mt-row"><span>ประเภท</span><b>${esc(o.ticketName || "-")}</b></div>
                            ${o.seatLabels ? `<div class="mt-row"><span>ที่นั่ง</span><b>${esc(o.seatLabels)}</b></div>` : ""}
                            <div class="mt-row"><span>จำนวน</span><b>${o.qty} ${o.seatLabels ? "ที่" : "ใบ"}</b></div>
                            <div class="mt-row"><span>ยอดรวม</span><b>${Number(o.total) === 0 ? "ฟรี" : money(o.total)}</b></div>
                        </div>
                        ${mtLiveCodes(o)}
                        <div class="mt-actions">${action}</div>
                    </div>
                </article>`;
            }

            try {
                const res = await fetch("/api/auth/orders", { headers: { Accept: "application/json" } });
                if (res.status === 401) { location.replace("/login.html?next=" + encodeURIComponent("/mytickets.html")); return; }
                if (!res.ok) throw new Error("โหลดประวัติการกดบัตรไม่สำเร็จ");
                const list = await res.json();
                if (!Array.isArray(list) || !list.length) {
                    summaryEl.innerHTML = "";
                    listEl.innerHTML = `<div class="empty"><i class="fa-regular fa-folder-open"></i>คุณยังไม่มีประวัติการกดบัตร <a class="btn red sm" href="/events.html" style="margin-top:14px"><i class="fa-solid fa-ticket"></i> ไปกดบัตรกันเลย</a></div>`;
                    return;
                }
                const tickets = list.reduce((s, o) => s + Number(o.qty || 0), 0);
                const total = list.reduce((s, o) => s + Number(o.total || 0), 0);
                const confirmed = list.filter(o => o.status === "completed").length;
                summaryEl.innerHTML = `
                    <div class="mt-stat"><small>รายการทั้งหมด</small><b>${list.length.toLocaleString("th-TH")}</b></div>
                    <div class="mt-stat"><small>ยืนยันแล้ว</small><b>${confirmed.toLocaleString("th-TH")}</b></div>
                    <div class="mt-stat"><small>บัตรทั้งหมด</small><b>${tickets.toLocaleString("th-TH")}</b></div>
                    <div class="mt-stat highlight"><small>ยอดรวม</small><b>${money(total)}</b></div>`;
                listEl.innerHTML = list.map(orderCard).join("");
            } catch (err) {
                listEl.innerHTML = `<div class="empty error"><i class="fa-solid fa-triangle-exclamation"></i>${esc(err.message)}</div>`;
            }
        })();
    </script>
    <script src="js/i18n.js?v=20261011"></script>
    <!-- mobile floating tab bar -->
    <nav class="tabbar" aria-label="เมนูหลัก">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a>
        <a href="/events.html"><i class="fa-solid fa-ticket"></i><span>คอนเสิร์ต</span></a>
        <a href="/calendar.html"><i class="fa-solid fa-calendar-days"></i><span>ปฏิทิน</span></a>
        <a class="active" href="/mytickets.html"><i class="fa-solid fa-receipt"></i><span>บัตรของฉัน</span></a>
        <a href="/login.html"><i class="fa-solid fa-user"></i><span>เข้าสู่ระบบ</span></a>
    </nav>
</body>
</html>
