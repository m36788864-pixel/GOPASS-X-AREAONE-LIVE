<!doctype html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>ใบเสร็จ | GOPASS</title>
    <link
        rel="icon"
        href="images/gopass-logo.png"
    >
    <link
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Kanit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet"
    >
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
    <link
        rel="stylesheet"
        href="css/app.css?v=20261013"
    >
    <script src="/js/maintenance.js?v=20261014"></script>
</head>
<body>
    <header class="site-header">
        <div class="wrap nav">
            <a
                class="brand"
                href="index.html"
            >
                <img
                    src="images/gopass-logo.png"
                    alt="GOPASS"
                    width="30"
                    height="30"
                >
                <span>
                    GOPASS
                    <small>TICKETING</small>
                </span>
            </a>
            <nav>
                <a href="index.html">
                    <i class="fa-solid fa-house"></i>
                    หน้าแรก
                </a>
                <a href="/events.html">
                    <i class="fa-solid fa-ticket"></i>
                    คอนเสิร์ต
                </a>
                <a href="/calendar.html">
                    <i class="fa-solid fa-calendar-days"></i>
                    ปฏิทิน
                </a>
            </nav>
        </div>
    </header>
    <main class="wrap receipt-page">
        <div class="receipt-wrap">
            <div class="receipt-steps">
                <div class="rs done">
                    <span>01</span>
                    <small>เลือกบัตร</small>
                </div>
                <div class="rline"></div>
                <div class="rs done">
                    <span>02</span>
                    <small>ข้อมูลผู้ซื้อ</small>
                </div>
                <div class="rline"></div>
                <div class="rs active">
                    <span>03</span>
                    <small>ใบเสร็จ</small>
                </div>
            </div>
            <section
                class="receipt"
                id="receipt"
            >
                <div class="receipt-head">
                    <div class="check">
                        <i class="fa-solid fa-check"></i>
                    </div>
                    <h1>ทำรายการสำเร็จ</h1>
                    <p>ระบบบันทึกข้อมูลการสั่งซื้อของคุณแล้ว</p>
                </div>
                <div class="receipt-body">
                    <div class="receipt-id">
                        <small>เลขที่รายการ</small>
                        <strong id="orderNo">กำลังโหลด...</strong>
                    </div>
                    <div id="info">
                        <div class="loading-block">
                            <i class="fa-solid fa-spinner fa-spin"></i>
                            กำลังโหลด...
                        </div>
                    </div>
                    <div class="receipt-actions">
                        <button
                            id="downloadBtn"
                            class="btn red"
                            type="button"
                            onclick="downloadReceiptJPG()"
                        >
                            <i class="fa-solid fa-image"></i>
                            บันทึกใบเสร็จ JPG
                        </button>
                        <a
                            class="btn outline"
                            href="index.html"
                        >
                            <i class="fa-solid fa-house"></i>
                            กลับหน้าแรก
                        </a>
                    </div>
                </div>
                <div class="receipt-foot">
                    GOPASS · กรุณาเก็บใบเสร็จนี้ไว้สำหรับตรวจสอบรายการ
                </div>
            </section>
        </div>
    </main>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="js/vendor/lenis.min.js"></script>
    <script src="js/auth-guard.js"></script>
    <script src="js/app.js?v=20261013"></script>
    <script>
        const p = new URLSearchParams(location.search);
        const id = p.get("id");
        const orderId = p.get("order");
        async function load() {
            try {
                const [er, or] = await Promise.all([
                    fetch("/api/events/" + encodeURIComponent(id)),
                    fetch("/api/orders/" + encodeURIComponent(orderId))
                ]);
                if (!er.ok || !or.ok) throw new Error("โหลดรายการไม่สำเร็จ");
                const e = await er.json();
                const o = await or.json();
                const b = o.buyer || {};
                // Retry the Sheets webhook so a receipt visit can repair a missed sync.
                if (b.email) {
                    try {
                        const sr = await fetch("/api/orders/" + encodeURIComponent(orderId) + "/sync-sheet", {
                            method: "POST",
                            headers: { "Content-Type": "application/json" }
                        });
                        const sj = await sr.json().catch(() => null);
                        if (!sr.ok || !sj?.ok) console.warn("[google-sheet] receipt sync failed:", sj);
                        else console.log("[google-sheet] receipt sync ok:", sj);
                    } catch (syncErr) {
                        console.warn("[google-sheet] receipt sync network error:", syncErr);
                    }
                }
                document.getElementById("orderNo").textContent = o.ticketNo || o.queueCode || o.id;
                document.getElementById("info").innerHTML = `
                    <div class="rrow"><span>งาน</span><b>${esc(e.name)}</b></div>
                    <div class="rrow"><span>วันที่ / เวลา</span><b>${esc(e.date)} · ${esc(e.time)} น.</b></div>
                    <div class="rrow"><span>สถานที่</span><b>${esc(e.venue)}</b></div>
                    <div class="rrow"><span>เลขบัตร</span><b>${esc(o.ticketNo || o.queueCode || o.id)}</b></div>
                    <div class="rrow"><span>ประเภทบัตร</span><b>${esc(o.ticketName || o.ticketType)}</b></div>
                    ${o.seatLabels ? `<div class="rrow"><span>ที่นั่ง</span><b>${esc(o.seatLabels)}</b></div>` : ""}
                    <div class="rrow"><span>จำนวน</span><b>${o.qty} ${o.seatLabels ? "ที่" : "ใบ"}</b></div>
                    <div class="rrow"><span>อีเมล</span><b>${esc(b.email)}</b></div>
                    <div class="rrow"><span>Discord</span><b>${esc(b.discord)}</b></div>
                    <div class="rrow"><span>Roblox</span><b>${esc(b.roblox)}</b></div>
                    ${liveCodesBox(o)}
                    <div class="r-total"><span>ยอดรวม</span><b>${Number(o.total) === 0 ? "ฟรี" : Number(o.total).toLocaleString("th-TH") + " บาท"}</b></div>`;
            } catch (error) {
                console.error(error);
                document.getElementById("info").textContent = "ไม่สามารถโหลดรายละเอียดรายการได้";
            }
        }
        // กล่องโค้ดดูไลฟ์สำหรับบัตร LIVE (ระบบออกโค้ดให้ตอนสั่งซื้อเสร็จ 1 โค้ด/1 บัตร และส่งเข้า Discord DM)
        function liveCodesBox(o) {
            const codes = Array.isArray(o.liveCodes) ? o.liveCodes.filter(Boolean) : [];
            if (!codes.length) return "";
            const site = o.liveSiteUrl || "";
            const dmOk = o.liveDmSentAt
                ? `<span><i class="fa-brands fa-discord"></i> ส่งโค้ดเข้า Discord DM ให้แล้ว</span>`
                : (o.liveDm && o.liveDm.ok
                    ? `<span><i class="fa-brands fa-discord"></i> ส่งเข้า Discord DM แล้ว</span>`
                    : `<span><i class="fa-brands fa-discord"></i> โค้ดจะถูกส่งเข้า Discord DM ให้ด้วย</span>`);
            return `
                <div class="live-codes">
                    <div class="live-codes-head">
                        <span class="live-codes-badge"><i class="fa-solid fa-tower-broadcast"></i> บัตร LIVE</span>
                        <b>โค้ดดูไลฟ์ของคุณ</b>
                        <small>กรอกโค้ดที่หน้าเว็บดูไลฟ์เพื่อเข้าชม · 1 โค้ด = 1 บัตร</small>
                    </div>
                    <div class="live-codes-list">${codes.map(c => `<code class="live-code">${esc(c)}</code>`).join("")}</div>
                    ${site ? `<a class="btn red sm live-codes-btn" href="${esc(site)}" target="_blank" rel="noopener"><i class="fa-solid fa-play"></i> ไปหน้าเว็บดูไลฟ์</a>` : ""}
                    <div class="live-codes-foot">${dmOk}</div>
                </div>`;
        }
        async function downloadReceiptJPG() {
            const receipt = document.getElementById("receipt");
            const button = document.getElementById("downloadBtn");
            if (!receipt) {
                toast("ไม่พบใบเสร็จ", "error");
                return;
            }
            const label = button.innerHTML;
            try {
                button.classList.add("jpg-loading");
                button.disabled = true;
                button.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> กำลังสร้าง JPG...`;
                // Export is always a light document, even when the page is dark.
                receipt.classList.add("capture");
                if (document.fonts && document.fonts.ready) await document.fonts.ready;
                const canvas = await html2canvas(receipt, {
                    scale: 2,
                    backgroundColor: "#ffffff",
                    useCORS: true,
                    logging: false,
                    windowWidth: receipt.scrollWidth,
                    windowHeight: receipt.scrollHeight
                });
                const jpg = canvas.toDataURL("image/jpeg", 0.95);
                let orderNo = document.getElementById("orderNo").textContent.trim();
                if (!orderNo || orderNo === "กำลังโหลด...") orderNo = "GOPASS-RECEIPT";
                const link = document.createElement("a");
                link.href = jpg;
                link.download = orderNo + ".jpg";
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } catch (error) {
                console.error("JPG ERROR:", error);
                toast("ไม่สามารถสร้างไฟล์ JPG ได้ กรุณาลองใหม่อีกครั้ง", "error");
            } finally {
                receipt.classList.remove("capture");
                button.classList.remove("jpg-loading");
                button.disabled = false;
                button.innerHTML = label;
            }
        }
        (async () => {
            // ดูใบเสร็จ/ประวัติ ต้องล็อกอินก่อน
            const user = await gopassRequireLogin("/receipt.html" + location.search);
            if (!user) return;
            load();
        })();
    </script>
    <script src="js/i18n.js?v=20261011"></script>
    <!-- mobile floating tab bar -->
    <nav class="tabbar" aria-label="เมนูหลัก">
        <a href="index.html"><i class="fa-solid fa-house"></i><span>หน้าแรก</span></a>
        <a href="/events.html"><i class="fa-solid fa-ticket"></i><span>คอนเสิร์ต</span></a>
        <a href="/calendar.html"><i class="fa-solid fa-calendar-days"></i><span>ปฏิทิน</span></a>
        <a class="active" href="/mytickets.html"><i class="fa-solid fa-receipt"></i><span>บัตรของฉัน</span></a>
        <a href="/login.html"><i class="fa-solid fa-user"></i><span>เข้าสู่ระบบ</span></a>
    </nav>
</body>
</html>
